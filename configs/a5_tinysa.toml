# Job file template: JG Aurora A5 gantry (hotend removed) + TinySA Ultra + TekBox TBPS01.
# The app (emcscan app) copies this into <job folder>\04_scan\scan.toml for each new job.
# Units: mm, seconds, Hz, dBm. Anything left out falls back to emcscan/config.py.

[job]
name = "customer_board"
photo_rectified = ""            # set by the app (Prep tab: Load board photo)
setup = ""                      # height setup JSON; empty = scan_setup.json next to this file

[plate]                         # the A5 bed cover (cad/a5_bed_cover.py --size 310 --thick 50)
width = 310.0
depth = 310.0
height = 50.0
marker_size = 20.0
marker_border = 3.0
marker_inset = 4.0
pocket_depth = 0.4

[board]
thickness = 1.6
tallest_part = 3.0              # only used when the job has no height setup

[probe]
name = "H20"                    # H20 / H10 / H5 / E5
orientation = "x"               # "x": blade along printer X (reads Hy); "y": blade along Y (reads Hx)
offset_z = 0.0                  # A5: the probe tip IS the reference point (no nozzle)
head_h = 20.0                   # probe mount v4 underside, 20.5 mm above the tip
head_r = 45.0

[printer]
type = "serial_gcode"
port = "COM15"
baud = 250000                   # JG Aurora A5, Marlin 1.1.8
bed_x = 300.0                   # soft limits X -5..305, Y 0..305
bed_y = 305.0
z_max = 250.0
z_min = 0.0                     # Marlin refuses Z below 0 (raised Z endstop)
has_nozzle = false
safe_z = 60.0
feed_xy = 3000.0
feed_z = 600.0
accel = 500.0
settle_s = 0.15

[calibration]                   # set in the app (Setup tab > Machine)
origin_x = 150.0
origin_y = 150.0
angle_deg = 0.0
# z_board_top is set with the probe tip touching a paper strip on the board top

[scan]                          # plate frame: origin = center of marker 0 (front-left)
x_min = 10.0
x_max = 60.0
y_min = 10.0
y_max = 60.0
step = 2.0
heights = [3.0]                 # nominal tip height above the board top; raised over tall parts
clearance = 1.0

[analyzer]
type = "tinysa"
port = "auto"
rbw_khz = "auto"
lna = "auto"                    # auto | on | off
lna_threshold_dbm = -40.0
overload_dbm = -30.0

[[analyzer.bands]]
name = "30-300 MHz"
start_hz = 30e6
stop_hz = 300e6
points = 450

[[analyzer.bands]]               # split at 800 MHz: TinySA Ultra floor steps down ~8 dB there
name = "300-800 MHz"
start_hz = 300e6
stop_hz = 800e6
points = 450

[[analyzer.bands]]
name = "800-1000 MHz"
start_hz = 800e6
stop_hz = 1000e6
points = 180

[output]
runs_dir = "runs"
